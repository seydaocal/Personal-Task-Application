<!DOCTYPE html>
<html lang="tr" >
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title%} Kişisel Görev Takip Uygulaması{%endblock%}</title>
    <style>
        * {
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        body {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: rgb(245,243,255);
            color:rgb(0, 0, 0);
        }

        a {
            color: rgb(37, 99, 235);
        }

        /* Üst Bar Stilleri */
        .navbar{
           background-color: rgb(43, 27, 78);
            border-bottom: 3px solid rgb(108, 92, 231);
            padding:0.75rem 2rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            text-decoration: none;
            color:rgb(255,255,255);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgb(255, 255, 255);
        }

        .nav-links a {
            text-decoration: none;
            color:rgb(255, 255, 255);
            font-size: 0.95rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color:rgb(255, 255, 255);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .nav-links button {
            background: rgb(255, 255, 255);
            color: rgb(43, 27, 78);
        }

        .nav-links button:hover {
            background: rgb(237, 233, 254);
        }

        /* Buton Stilleri */
        .btn-primary {
            background-color: rgb(108, 92, 231) !important;
            color: #ffffff !important;
        }

        .btn-primary:hover {
            background-color: rgb(88,70,214) !important;
        }

        .username {
            font-weight: 600;
            color: rgb(255,255,255);
        }

        /* Ana İçerik Konteyneri */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .toolbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 1rem; 
        }
        .btn, button, .actions a{ 
            background: rgb(108,92,231); 
            color: #fff; 
            padding: 0.4rem 0.8rem; 
            border-radius: 6px; 
            text-decoration: none; 
            border: none; 
            cursor: pointer;
            font-size: 0.95rem;
            font-family: inherit;
            display: inline-block;
        }
        .btn:hover, button:hover, .actions a:hover{
            background: rgb(88, 70, 214);
        }

        .filters { 
            display: flex; 
            gap: 0.5rem; 
            flex-wrap: wrap; 
            margin-bottom: 1rem; 
            align-items: center; 
        }
        input, select, button, textarea { 
            padding: 0.4rem 0.6rem; 
            font-size: 0.95rem;
            border: 1.5px solid rgb(207, 201, 234);
            border-radius: 6px;
        }
         input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgb(108, 92, 231);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background:rgb(255,255, 255); 
        }

        th {
            background: rgb(237, 233, 254);
            color: rgb(43, 27, 78);
        }

        th, td { 
            border-bottom: 1px solid rgb(221,214,254); 
            padding: 0.6rem; 
            text-align: left; 
        }
        .actions form { 
            display: inline; 
        }
        form p { 
            margin-bottom: 0.8rem; 
        }
        form p label { 
            display: block; 
            margin-bottom: 0.2rem; 
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <header class="navbar">
        <a href="{% url 'home' %}" class="navbar-brand">Kişisel Görev Takip Uygulaması</a>
        <nav>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <span>Merhaba, <span class="username">{{ user.username }}</span></span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Çıkış Yap</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Giriş Yap</a>
                    <a href="{% url 'register' %}" class="btn-primary">Kayıt Ol</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <!-- Sayfaya Özel İçerik Alanı -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
